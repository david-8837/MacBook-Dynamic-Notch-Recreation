<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacBook Dynamic Notch Recreation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 0; background-color: #050507;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow-x: hidden;
    }
    .stage-box { position: relative; margin-top: 12px; }
    .laptop-frame {
      position: absolute; top: 0; left: 0; width: 1964px; height: 1124px;
      transform-origin: top left; background: #050507; border: 2px solid #2a2d38;
      border-radius: 30px; padding: 20px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.7);
    }
    .screen-display {
      position: relative; width: 100%; height: 100%; border-radius: 8px; overflow: hidden;
      background: linear-gradient(180deg, #e6edfc 0%, #c6d5f8 34%, #7a92e8 68%, #2c3a94 90%, #0a0c1e 100%);
    }
    .spec-label { font-size: 11.5px; color: #7e8089; letter-spacing: -0.01em; margin-top: 10px; text-align: center; }

    /* Wallpaper */
    .wallpaper-petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .wallpaper-art {
      position: absolute; left: 50%; top: 0; width: 1180px; height: 460px;
      transform-origin: top center; transform: translateX(-50%) scale(2.35);
    }
    .petal { position: absolute; border-radius: 50% 50% 40% 40%; filter: blur(1px); opacity: 0.85; }
    .petal-center {
      width: 240px; height: 360px; left: 50%; top: 18px; transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(132, 108, 240, 0.82) 0%, rgba(72, 102, 248, 0.72) 52%, rgba(25, 36, 112, 0.2) 100%);
      border-radius: 120px 120px 60px 60px;
    }
    .petal-left-inner {
      width: 225px; height: 340px; left: calc(50% - 125px); top: 32px; transform: translateX(-50%) rotate(-12deg);
      background: linear-gradient(180deg, rgba(145, 114, 244, 0.8) 0%, rgba(92, 98, 242, 0.65) 58%, transparent 100%);
      border-radius: 115px 115px 50px 50px;
    }
    .petal-right-inner {
      width: 225px; height: 340px; left: calc(50% + 125px); top: 32px; transform: translateX(-50%) rotate(12deg);
      background: linear-gradient(180deg, rgba(145, 114, 244, 0.8) 0%, rgba(92, 98, 242, 0.65) 58%, transparent 100%);
      border-radius: 115px 115px 50px 50px;
    }
    .petal-left-outer {
      width: 250px; height: 320px; left: calc(50% - 245px); top: 105px; transform: translateX(-50%) rotate(-24deg);
      background: linear-gradient(180deg, rgba(138, 104, 232, 0.78) 0%, rgba(78, 76, 198, 0.52) 68%, transparent 100%);
      border-radius: 120px;
    }
    .petal-right-outer {
      width: 250px; height: 320px; left: calc(50% + 245px); top: 105px; transform: translateX(-50%) rotate(24deg);
      background: linear-gradient(180deg, rgba(138, 104, 232, 0.78) 0%, rgba(78, 76, 198, 0.52) 68%, transparent 100%);
      border-radius: 120px;
    }
    .wallpaper-horizon {
      position: absolute; left: 0; right: 0; top: 235px; height: 230px;
      background: linear-gradient(180deg, rgba(122, 146, 235, 0.1) 0%, rgba(56, 74, 184, 0.55) 36%, rgba(12, 15, 38, 0.94) 82%, #050507 100%);
    }

    /* Dynamic Notch Container */
    .notch-wrapper {
      position: absolute; top: 0; left: 50%; --notch-scale: 1.6;
      transform: translateX(-50%) scale(var(--notch-scale)); transform-origin: top center;
      z-index: 30; display: flex; justify-content: center;
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .notch-body {
      position: relative; background-color: #08080a; color: #ffffff;
      border-radius: 0 0 34px 34px; overflow: visible;
      will-change: width, height, border-radius, padding;
      box-shadow: 0 18px 40px rgba(0,0,0,0.52), 0 3px 10px rgba(0,0,0,0.35), inset 0 -1px 0 rgba(255,255,255,0.08);
      transition:
        width 0.52s cubic-bezier(0.32, 1.18, 0.42, 1),
        height 0.52s cubic-bezier(0.32, 1.18, 0.42, 1),
        padding 0.52s cubic-bezier(0.32, 1.18, 0.42, 1),
        border-radius 0.52s cubic-bezier(0.32, 1.18, 0.42, 1),
        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes auroraBreathe {
      0%, 100% { filter: saturate(1) brightness(1); }
      50% { filter: saturate(1.22) brightness(1.14); }
    }
    .resting-glow-layer {
      position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      background:
        radial-gradient(68% 90% at calc(16% + var(--glow-shift, 0%)) 100%, rgba(14, 165, 233, 0.84) 0%, transparent 72%),
        radial-gradient(68% 92% at calc(50% + var(--glow-shift, 0%)) 100%, rgba(37, 99, 235, 0.9) 0%, transparent 76%),
        radial-gradient(68% 90% at calc(84% + var(--glow-shift, 0%)) 100%, rgba(139, 44, 224, 0.84) 0%, transparent 72%),
        linear-gradient(180deg, #08080a 22%, #0b0e1e 62%, #12183b 100%);
      box-shadow: inset 0 -1px 1.5px rgba(255, 255, 255, 0.22);
      transition: opacity 0.4s ease; animation: auroraBreathe 4.2s infinite ease-in-out; z-index: 0;
    }
    .notch-body.state-resting .resting-glow-layer,
    .notch-body.state-waving .resting-glow-layer,
    .notch-body.state-vibing .resting-glow-layer,
    .notch-body.state-surprised .resting-glow-layer { opacity: 1; }
    .notch-body.state-sleeping .resting-glow-layer { opacity: 0.72; }

    .notch-inner-clip { position: relative; z-index: 1; width: 100%; height: 100%; overflow: hidden; border-radius: inherit; }

    #notchContent {
      width: 100%; height: 100%; opacity: 1;
      transform: scale(1) translate3d(0, 0, 0); filter: blur(0px);
      transform-origin: top center; will-change: opacity, transform, filter;
      transition:
        opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.22s ease-out;
    }
    #notchContent.morphing-hidden {
      opacity: 0;
      transform: scale(0.96) translate3d(var(--slide-x, 0px), var(--slide-y, -4px), 0);
      filter: blur(4px);
      transition: opacity 0.09s ease-in, transform 0.12s ease-in, filter 0.09s ease-in;
      pointer-events: none;
    }

    /* Persistent Expanded Top Bar */
    .persistent-top-bar {
      position: absolute; top: 8px; left: 22px; right: 22px; display: flex;
      align-items: center; justify-content: space-between; z-index: 5;
      pointer-events: none; opacity: 0; transform: translateY(-3px);
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .notch-body.state-expanded .persistent-top-bar,
    .notch-body.state-lyrics .persistent-top-bar { opacity: 1; transform: translateY(0); }
    .notch-body.state-expanded .persistent-top-bar.morphing-hidden,
    .notch-body.state-lyrics .persistent-top-bar.morphing-hidden {
      opacity: 0; transform: translateY(-3px); transition: opacity 0.1s ease-in, transform 0.1s ease-in;
    }

    /* Persistent Sliding Pagination Dots Bar */
    .persistent-pagination-bar {
      position: absolute; bottom: 5px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 6; opacity: 0; transform: translateY(3px);
      pointer-events: none;
      transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .notch-body.state-expanded .persistent-pagination-bar,
    .notch-body.state-lyrics .persistent-pagination-bar {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .notch-body.state-expanded .persistent-pagination-bar.morphing-hidden,
    .notch-body.state-lyrics .persistent-pagination-bar.morphing-hidden {
      opacity: 0; transform: translateY(3px); pointer-events: none;
      transition: opacity 0.1s ease-in, transform 0.1s ease-in;
    }

    .pagination-track {
      position: relative; display: flex; align-items: center; gap: 6px;
      height: 8px; padding: 0 2px;
    }
    .page-dot-btn {
      width: 3.5px; height: 3.5px; border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.28);
      border: none; padding: 0; cursor: pointer;
      transition:
        width 0.36s cubic-bezier(0.34, 1.56, 0.64, 1),
        background-color 0.28s ease,
        transform 0.2s ease;
    }
    .page-dot-btn:hover { background-color: rgba(255, 255, 255, 0.6); transform: scale(1.2); }
    .page-dot-btn.active {
      width: 14px; height: 3.2px;
      background-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
      transform: scale(1);
    }

    .camera-dot {
      position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2f3b54 0%, #161b26 65%, #0c0e14 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04); pointer-events: none; z-index: 10;
    }

    /* Top Left & Right Concave Inverse Fillets ("Notch Ears") */
    .notch-ear-left, .notch-ear-right {
      position: absolute; top: 0; width: 26px; height: 26px;
      pointer-events: none; overflow: hidden; transition: all 0.52s cubic-bezier(0.32, 1.18, 0.42, 1);
    }
    .notch-ear-left { left: -25px; }
    .notch-ear-right { right: -25px; }
    .notch-ear-left::before {
      content: ""; position: absolute; top: 0; right: 0; width: 52px; height: 52px;
      border-radius: 50%; box-shadow: 26px -26px 0 0 #08080a;
    }
    .notch-ear-right::before {
      content: ""; position: absolute; top: 0; left: 0; width: 52px; height: 52px;
      border-radius: 50%; box-shadow: -26px -26px 0 0 #08080a;
    }

    .notch-body.state-resting .notch-ear-left, .notch-body.state-resting .notch-ear-right,
    .notch-body.state-waving .notch-ear-left, .notch-body.state-waving .notch-ear-right,
    .notch-body.state-sleeping .notch-ear-left, .notch-body.state-sleeping .notch-ear-right,
    .notch-body.state-vibing .notch-ear-left, .notch-body.state-vibing .notch-ear-right,
    .notch-body.state-surprised .notch-ear-left, .notch-body.state-surprised .notch-ear-right,
    .notch-body.state-closed .notch-ear-left, .notch-body.state-closed .notch-ear-right { width: 14px; height: 14px; }

    .notch-body.state-resting .notch-ear-left, .notch-body.state-waving .notch-ear-left,
    .notch-body.state-sleeping .notch-ear-left, .notch-body.state-vibing .notch-ear-left,
    .notch-body.state-surprised .notch-ear-left, .notch-body.state-closed .notch-ear-left { left: -13px; }

    .notch-body.state-resting .notch-ear-right, .notch-body.state-waving .notch-ear-right,
    .notch-body.state-sleeping .notch-ear-right, .notch-body.state-vibing .notch-ear-right,
    .notch-body.state-surprised .notch-ear-right, .notch-body.state-closed .notch-ear-right { right: -13px; }

    .notch-body.state-resting .notch-ear-left::before, .notch-body.state-waving .notch-ear-left::before,
    .notch-body.state-sleeping .notch-ear-left::before, .notch-body.state-vibing .notch-ear-left::before,
    .notch-body.state-surprised .notch-ear-left::before, .notch-body.state-closed .notch-ear-left::before {
      width: 28px; height: 28px; box-shadow: 14px -14px 0 0 #08080a;
    }
    .notch-body.state-resting .notch-ear-right::before, .notch-body.state-waving .notch-ear-right::before,
    .notch-body.state-sleeping .notch-ear-right::before, .notch-body.state-vibing .notch-ear-right::before,
    .notch-body.state-surprised .notch-ear-right::before, .notch-body.state-closed .notch-ear-right::before {
      width: 28px; height: 28px; box-shadow: -14px -14px 0 0 #08080a;
    }

    /* Unified 138px Vertical Height & 34px Curve for both Expanded & Lyrics States */
    .notch-body.state-expanded {
      width: 416px; height: 138px; padding: 10px 22px 5px 22px; border-radius: 0 0 34px 34px;
    }
    .notch-body.state-lyrics {
      width: 454px; height: 138px; padding: 10px 22px 5px 22px; border-radius: 0 0 34px 34px;
      background:
        radial-gradient(92% 72% at 24% 108%, rgba(44, 114, 218, 0.58) 0%, rgba(25, 70, 152, 0.25) 54%, transparent 86%),
        radial-gradient(92% 72% at 76% 108%, rgba(44, 114, 218, 0.58) 0%, rgba(25, 70, 152, 0.25) 54%, transparent 86%),
        linear-gradient(180deg, #050507 0%, #05070d 45%, #0c1e40 77%, #1b427e 100%);
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.28),
        inset 0 -1px 0 rgba(120, 175, 255, 0.18),
        inset 1px 0 0 rgba(255, 255, 255, 0.05),
        inset -1px 0 0 rgba(255, 255, 255, 0.05);
    }

    /* Unified Music <-> Lyrics Split Morph Architecture */
    .music-lyrics-shell {
      display: flex; align-items: stretch; width: 100%; height: 100%; padding-top: 8px;
    }
    .music-primary-pane {
      flex: 0 0 100%; width: 100%; min-width: 0;
      display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 11px;
      transition: flex-basis 0.48s cubic-bezier(0.32, 1.12, 0.42, 1), width 0.48s cubic-bezier(0.32, 1.12, 0.42, 1);
    }
    .music-lyrics-shell.is-lyrics-open .music-primary-pane {
      flex: 0 0 186px; width: 186px;
    }
    .music-meta-column {
      flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end;
      padding-top: 13px;
      transition: padding-top 0.48s cubic-bezier(0.32, 1.12, 0.42, 1);
    }
    .music-lyrics-shell.is-lyrics-open .music-meta-column {
      padding-top: 16px;
    }
    .music-next-arrow-btn {
      opacity: 1; transform: scale(1);
      transition: opacity 0.22s ease, transform 0.28s ease, width 0.35s ease;
    }
    .music-lyrics-shell.is-lyrics-open .music-next-arrow-btn {
      opacity: 0; transform: scale(0.7); width: 0; overflow: hidden; pointer-events: none; margin: 0; padding: 0;
    }
    .music-transport-row {
      position: relative; display: flex; align-items: center; justify-content: center; margin-top: 3px; height: 18px;
    }
    .music-transport-buttons {
      display: flex; align-items: center; gap: 24px;
      transform: translateX(0px);
      transition: transform 0.48s cubic-bezier(0.32, 1.12, 0.42, 1), gap 0.48s cubic-bezier(0.32, 1.12, 0.42, 1);
    }
    .music-lyrics-shell.is-lyrics-open .music-transport-buttons {
      gap: 20px;
      transform: translateX(18px);
    }
    .lyrics-secondary-pane {
      flex: 0 0 0px; width: 0px; opacity: 0; overflow: hidden;
      display: flex; align-items: center; gap: 13px;
      margin-left: 0px; padding-bottom: 10px;
      transform: translateX(16px); filter: blur(4px); pointer-events: none;
      transition:
        flex-basis 0.48s cubic-bezier(0.32, 1.12, 0.42, 1),
        width 0.48s cubic-bezier(0.32, 1.12, 0.42, 1),
        margin-left 0.48s cubic-bezier(0.32, 1.12, 0.42, 1),
        opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1) 0.08s,
        transform 0.46s cubic-bezier(0.22, 1, 0.36, 1) 0.06s,
        filter 0.32s ease-out 0.08s;
    }
    .music-lyrics-shell.is-lyrics-open .lyrics-secondary-pane {
      flex: 1 1 auto; width: auto; opacity: 1; margin-left: 14px;
      transform: translateX(0px); filter: blur(0px); pointer-events: auto;
    }

    .notch-body.state-notification { width: 332px; height: 68px; padding: 13px 20px 13px 16px; border-radius: 0 0 24px 24px; }
    .notch-body.state-charging { width: 332px; height: 68px; padding: 14px 20px 14px 16px; border-radius: 0 0 24px 24px; }
    .notch-body.state-headphones { width: 332px; height: 68px; padding: 14px 18px 14px 16px; border-radius: 0 0 24px 24px; }

    .notch-body.state-resting, .notch-body.state-waving, .notch-body.state-sleeping,
    .notch-body.state-vibing, .notch-body.state-surprised {
      width: 154px; height: 32px; padding: 0; border-radius: 0 0 13px 13px;
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.25), 0 6px 18px rgba(147, 51, 234, 0.2);
    }

    /* Charging Ring & Lightning Bolt Animations */
    @keyframes chargeArcSweep70 {
      0% { stroke-dashoffset: 91.1; filter: drop-shadow(0 0 0px rgba(48, 209, 88, 0)); }
      60% { stroke-dashoffset: 25.5; filter: drop-shadow(0 0 6px rgba(48, 209, 88, 0.85)); }
      100% { stroke-dashoffset: 27.3; filter: drop-shadow(0 0 3px rgba(48, 209, 88, 0.5)); }
    }
    @keyframes chargeArcPulse70 {
      0%, 100% { stroke-dashoffset: 27.3; filter: drop-shadow(0 0 2px rgba(48, 209, 88, 0.4)); }
      50% { stroke-dashoffset: 22.8; filter: drop-shadow(0 0 7px rgba(48, 209, 88, 0.95)); }
    }
    @keyframes chargeArcSweep82 {
      0% { stroke-dashoffset: 110; filter: drop-shadow(0 0 0px rgba(48, 209, 88, 0)); }
      65% { stroke-dashoffset: 18.2; filter: drop-shadow(0 0 6px rgba(48, 209, 88, 0.85)); }
      100% { stroke-dashoffset: 19.8; filter: drop-shadow(0 0 3px rgba(48, 209, 88, 0.5)); }
    }
    @keyframes chargeArcPulse82 {
      0%, 100% { stroke-dashoffset: 19.8; filter: drop-shadow(0 0 2px rgba(48, 209, 88, 0.4)); }
      50% { stroke-dashoffset: 15.5; filter: drop-shadow(0 0 7px rgba(48, 209, 88, 0.95)); }
    }
    @keyframes chargeBoltPopAndPulse {
      0% { transform: scale(0.35) rotate(-14deg); opacity: 0; }
      45% { transform: scale(1.18) rotate(3deg); opacity: 1; filter: drop-shadow(0 0 7px rgba(255,255,255,0.95)) drop-shadow(0 0 12px rgba(48,209,88,0.9)); }
      70% { transform: scale(0.95) rotate(0deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 3px rgba(255,255,255,0.5)); }
    }
    @keyframes chargeBoltBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,255,255,0.35)); }
      50% { transform: scale(1.13); filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 10px rgba(48,209,88,0.85)); }
    }
    @keyframes btArcSweep70 {
      0% { stroke-dashoffset: 91.1; filter: drop-shadow(0 0 0px rgba(56, 189, 248, 0)); }
      65% { stroke-dashoffset: 25.5; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.85)); }
      100% { stroke-dashoffset: 27.3; filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.5)); }
    }

    .charge-ring-arc-70 {
      animation: chargeArcSweep70 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards, chargeArcPulse70 2.2s ease-in-out 0.95s infinite;
    }
    .charge-ring-arc-82 {
      animation: chargeArcSweep82 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards, chargeArcPulse82 2.2s ease-in-out 0.95s infinite;
    }
    .charge-bolt-icon {
      transform-origin: center;
      animation: chargeBoltPopAndPulse 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, chargeBoltBreathe 2.2s ease-in-out 0.85s infinite;
    }
    .bt-ring-arc-70 { animation: btArcSweep70 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* Companion AI Animations */
    @keyframes notchSaccadeGaze {
      0%, 13% { transform: translate(0px, 0px) rotate(0deg); }
      15.5%, 27% { transform: translate(-5.5px, 0.6px) rotate(-3.5deg); }
      30%, 42% { transform: translate(0px, 0.3px) rotate(0deg); }
      44.5%, 57% { transform: translate(5.8px, -1px) rotate(3.8deg); }
      59.5%, 68% { transform: translate(2.8px, 1.4px) rotate(1.5deg); }
      71%, 81% { transform: translate(-1.8px, -1.6px) rotate(-1.5deg); }
      84%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes notchLeftEyeExpressive {
      0%, 10.5% { transform: scale(1, 1); }
      11.8% { transform: scale(1.22, 0.08); }
      13.2%, 14.5% { transform: scale(1, 1); }
      16%, 27% { transform: scale(1.08, 1.07); }
      29.5%, 35% { transform: scale(1, 1); }
      36.2% { transform: scale(1.22, 0.08); }
      37.4% { transform: scale(0.97, 1.04); }
      38.6% { transform: scale(1.22, 0.08); }
      40%, 43.5% { transform: scale(1, 1); }
      45%, 57% { transform: scale(0.92, 0.84); }
      60%, 68% { transform: scale(1.05, 0.72); }
      71.5%, 81% { transform: scale(1.06, 1.1); }
      83.5%, 90% { transform: scale(1, 1); }
      91.5% { transform: scale(1.2, 0.09); }
      93%, 100% { transform: scale(1, 1); }
    }
    @keyframes notchRightEyeExpressive {
      0%, 10.7% { transform: scale(1, 1); }
      12% { transform: scale(1.22, 0.08); }
      13.4%, 14.5% { transform: scale(1, 1); }
      16%, 27% { transform: scale(0.92, 0.86); }
      29.5%, 35.2% { transform: scale(1, 1); }
      36.4% { transform: scale(1.22, 0.08); }
      37.6% { transform: scale(0.97, 1.04); }
      38.8% { transform: scale(1.22, 0.08); }
      40.2%, 43.5% { transform: scale(1, 1); }
      45%, 57% { transform: scale(1.09, 1.08); }

    window.addEventListener("resize", fitDisplay);
    fitDisplay();

    const tracks = [
      {

        lyrics: ["and send them through the sky", "to find you by the sea", "every wing a little song", "that carries us along"]

      autoSleeping: false, proximityWaving: false,
      todoSubMode: "list", // "list" | "add" | "edit"
      todoCompact: false,
      todoDraftTitle: "",
      todoDraftTime: "",
      todoDraftRepeat: "Daily",
      todos: [

    const notchBody = document.getElementById("notchBody");
    const notchContent = document.getElementById("notchContent");
    const persistentTopBar = document.getElementById("persistentTopBar");
    const persistentPaginationBar = document.getElementById("persistentPaginationBar");

    let chargeCountTimer = null;

    function animatePercentageCounter(elementId, targetValue, duration = 850) {
      clearInterval(chargeCountTimer);
      const el = document.getElementById(elementId);
      if (!el) return;
      const startTime = performance.now();
      chargeCountTimer = setInterval(() => {
        const currentEl = document.getElementById(elementId);
        if (!currentEl) { clearInterval(chargeCountTimer); return; }
        const progress = Math.min(1, (performance.now() - startTime) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        currentEl.textContent = `${Math.round(targetValue * eased)}%`;
        if (progress >= 1) clearInterval(chargeCountTimer);
      }, 16);
    }

    function updateCaption(text) { if (modeCaption) modeCaption.textContent = text; }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }

    function getAlbumArtSVG(size = 54) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" class="rounded-[11px] shrink-0 shadow-md">

    function updatePaginationDots(activeMode) {
      document.querySelectorAll(".page-dot-btn").forEach(dot => {
        dot.classList.toggle("active", dot.dataset.page === activeMode);
      });
    }

    function cycleExpandedPage(direction = 1) {
      const currentIdx = expandedModes.indexOf(state.mode);
      const nextIdx = currentIdx === -1
        ? (direction > 0 ? 0 : expandedModes.length - 1)
        : (currentIdx + direction + expandedModes.length) % expandedModes.length;
      switchMode(expandedModes[nextIdx], false, direction);
    }

    function getNextCompanionMode(current) {
      return companionModes[(companionModes.indexOf(current) + 1) % companionModes.length];
    }

    function getCompanionStageClass(mode) {
      if (mode === "Waving") return "is-waving";
      if (mode === "Sleeping") return "is-sleeping";
      if (mode === "Vibing") return "is-vibing";
      if (mode === "Surprised") return "is-surprised";
      return "";
    }

      const nextMode = getNextCompanionMode(companionMode);

              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="flex-1 grid grid-cols-[1.15fr_1fr] gap-2 min-w-0">
              <div class="h-[72px] rounded-[12px] bg-[#131418] border border-white/[0.06] px-2.5 py-1.5 flex flex-col justify-between min-w-0">
                <div class="text-[8px] font-semibold tracking-wider text-[#7e8089] uppercase leading-none">THIS WEEK</div>
                <div class="grid grid-cols-7 gap-0.5 text-center">
                  ${weekDays.map(d => `
                    <div class="flex flex-col items-center">
                      <span class="text-[7px] font-medium ${d.active ? "text-[#3898EC]" : "text-[#6e7079]"} leading-none mb-0.5">${d.day}</span>
                      <span class="w-3.5 h-3.5 rounded-full ${d.active ? "bg-[#1A73E8] text-white font-bold" : "text-[#e2e3e8] font-semibold"} text-[8.5px] flex items-center justify-center leading-none tabular-nums">${d.date}</span>
                      <span class="w-1 h-1 rounded-full mt-0.5" style="background-color: ${d.dot || "transparent"};"></span>
                    </div>`).join("")}
                </div>
                <div class="flex items-start gap-1.5 min-w-0">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#30D158] mt-1 shrink-0"></span>
                  <div class="min-w-0 leading-tight">
                    <div class="text-[9px] font-semibold text-white truncate">3 tasks today</div>
                    <div class="text-[7.5px] text-[#7e8089] truncate">Next: Weekly sync, 11:00</div>
                  </div>
                </div>
              </div>
              <div class="h-[72px] rounded-[12px] bg-[#131418] border border-white/[0.06] px-3 py-1.5 flex flex-col justify-between min-w-0">
                <div class="text-[8px] font-semibold tracking-wider text-[#7e8089] uppercase leading-none">BATTERY</div>
                <div class="flex items-center gap-2.5 my-auto">
                  <div class="relative w-9 h-9 flex items-center justify-center shrink-0">
                    <svg width="36" height="36" viewBox="0 0 44 44" class="-rotate-90 overflow-visible">
                      <circle cx="22" cy="22" r="17.5" stroke="rgba(48, 209, 88, 0.2)" stroke-width="4" fill="none"/>
                      <circle class="charge-ring-arc-82" cx="22" cy="22" r="17.5" stroke="#30D158" stroke-width="4" stroke-dasharray="110" stroke-dashoffset="110" stroke-linecap="round" fill="none"/>
                    </svg>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff" class="absolute charge-bolt-icon">
                      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                  </div>
                  <div class="flex flex-col min-w-0">
                    <span id="widgetBatteryPctLabel" class="text-[17px] font-bold text-white leading-none tracking-[-0.02em] tabular-nums">82%</span>
                    <span class="text-[9px] font-semibold text-[#30D158] leading-tight mt-0.5">Charging</span>
                    <span class="text-[7.5px] text-[#7e8089] leading-tight">Plugged in</span>
                  </div>
                </div>
              </div>
            </div>
            <button onclick="cycleExpandedPage(1)" title="Next (→)" class="nav-arrow w-5 h-5 rounded-full bg-[#242529] hover:bg-[#32343a] active:scale-95 flex items-center justify-center text-[#d4d5da] transition shrink-0 cursor-pointer">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>`;
    }

    function renderClipboardView() {
      return `
        <div class="pt-2">
          ${renderTopHeader("Shelf")}
          <div class="flex items-center gap-2 h-[70px] mt-1.5 px-0.5">
            <button onclick="cycleExpandedPage(-1)" title="Previous (←)" class="nav-arrow w-6 h-6 rounded-full bg-[#242529] hover:bg-[#32343a] active:scale-95 flex items-center justify-center text-[#d4d5da] transition shrink-0 cursor-pointer">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="flex-1 flex flex-col items-center justify-center text-center min-w-0 px-1 -mt-1">
              <div class="text-[13px] font-semibold text-white leading-tight tracking-[-0.01em]">Copy some text</div>
              <div class="text-[10.5px] text-[#7e8089] mt-1 leading-tight">It will wait here, ready to paste again</div>
            </div>
            <button onclick="cycleExpandedPage(1)" title="Next (→)" class="nav-arrow w-6 h-6 rounded-full bg-[#242529] hover:bg-[#32343a] active:scale-95 flex items-center justify-center text-[#d4d5da] transition shrink-0 cursor-pointer">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>`;
    }

    let morphRevealTimer = null;
    let morphSwapTimer = null;

    function applyNotchDOM(transitionContext = null) {
      notchBody.classList.remove(
        "state-expanded", "state-notification", "state-charging", "state-headphones",
        "state-lyrics", "state-resting", "state-waving", "state-sleeping",
        "state-vibing", "state-surprised", "state-closed"
      );
      notchBody.classList.toggle("playing", state.isPlaying);
      notchBody.classList.toggle("paused", !state.isPlaying);

      if (expandedModes.includes(state.mode) || state.mode === "Lyrics") {
        persistentDateCluster.style.transform = "translate(0px, -2.5px)";
        persistentTimeText.textContent = (state.mode === "Music" || state.mode === "Lyrics") ? "20:37" : state.mode === "Shelf" ? "21:17" : state.mode === "Widgets" ? "21:38" : "20:30";
        updatePaginationDots(state.mode === "Lyrics" ? "Music" : state.mode);

        const isShelfOrClipboard = state.mode === "Shelf" || state.mode === "Clipboard";
        const showEq = !isShelfOrClipboard && state.mode !== "Lyrics";
        headerEq.classList.toggle("hidden", !showEq);
        headerEq.classList.toggle("flex", showEq);
        headerShelfSwitch.classList.toggle("hidden", !isShelfOrClipboard);
        headerShelfSwitch.classList.toggle("flex", isShelfOrClipboard);

        if (isShelfOrClipboard) {
          const onShelf = state.mode === "Shelf";
          shelfTabBtn.className = `px-2 py-[2px] rounded-full flex items-center justify-center transition-all duration-200 cursor-pointer ${onShelf ? "bg-[#5B5CE6] text-white shadow-sm" : "text-[#8e9099] hover:text-white"}`;
          clipboardTabBtn.className = `px-2 py-[2px] rounded-full flex items-center justify-center transition-all duration-200 cursor-pointer ${!onShelf ? "bg-[#5B5CE6] text-white shadow-sm" : "text-[#8e9099] hover:text-white"}`;
        }
      }

      if (state.mode === "Closed") {
        notchBody.classList.add("state-closed");
        notchContent.innerHTML = renderClosedView();
      } else if (companionModes.includes(state.mode)) {
        const stateClassMap = {
          "Resting": "state-resting", "Waving": "state-waving", "Sleeping": "state-sleeping",
          "Vibing": "state-vibing", "Surprised": "state-surprised"
        };
        notchBody.classList.add(stateClassMap[state.mode]);
        const existingStage = document.getElementById("companionStage");
        const existingRoot = document.getElementById("companionRoot");
        if (existingStage && existingRoot) {
          existingStage.classList.toggle("is-waving", state.mode === "Waving");
          existingStage.classList.toggle("is-sleeping", state.mode === "Sleeping");
          existingStage.classList.toggle("is-vibing", state.mode === "Vibing");
          existingStage.classList.toggle("is-surprised", state.mode === "Surprised");
          if (state.mode !== "Resting") {
            existingStage.style.setProperty("--look-x", "0px");
            existingStage.style.setProperty("--look-y", "0px");
            existingStage.style.setProperty("--look-tilt", "0deg");
            existingStage.classList.remove("is-tracking");
          }
          const nextMode = getNextCompanionMode(state.mode);
          existingRoot.setAttribute("onclick", `switchMode('${nextMode}')`);
        } else {
          notchContent.innerHTML = renderCompanionView(state.mode);
        }
      } else if (state.mode === "Notification") {
        notchBody.classList.add("state-notification");
        notchContent.innerHTML = renderNotificationView();
      } else if (state.mode === "Charging") {
        notchBody.classList.add("state-charging");
        notchContent.innerHTML = renderChargingView();
        animatePercentageCounter("chargingPctLabel", 70, 880);
      } else if (state.mode === "Headphones") {
        notchBody.classList.add("state-headphones");
        notchContent.innerHTML = renderHeadphonesView();
      } else if (state.mode === "Music" || state.mode === "Lyrics") {
        const isLyrics = state.mode === "Lyrics";
        notchBody.classList.add(isLyrics ? "state-lyrics" : "state-expanded");
        const existingShell = document.getElementById("musicLyricsShell");
        if (existingShell && (transitionContext === "music-to-lyrics" || transitionContext === "lyrics-to-music")) {
          existingShell.classList.toggle("is-lyrics-open", isLyrics);
          const toggleBtn = document.getElementById("lyricsToggleBtn");
          if (toggleBtn) {
            toggleBtn.setAttribute("onclick", `switchMode('${isLyrics ? "Music" : "Lyrics"}')`);
            toggleBtn.className = `absolute left-4 hover:opacity-85 transition cursor-pointer ${isLyrics ? "text-white" : "text-[#8e9099] hover:text-white"}`;
          }
        } else {
          notchContent.innerHTML = renderMusicLyricsSplitView(isLyrics);
        }
      } else {
        notchBody.classList.add("state-expanded");
        if (state.mode === "Water") notchContent.innerHTML = renderWaterView();
        else if (state.mode === "Shelf") notchContent.innerHTML = renderShelfView();
        else if (state.mode === "To-do") notchContent.innerHTML = renderTodoView();
        else if (state.mode === "Widgets") {
          notchContent.innerHTML = renderWidgetsView();
          animatePercentageCounter("widgetBatteryPctLabel", 82, 880);
        } else if (state.mode === "Focus timer") notchContent.innerHTML = renderFocusView();
        else notchContent.innerHTML = renderClipboardView();
      }
    }

    function renderNotch(animateMorph = false, keepPersistentHeader = false, slideDirection = 0, transitionContext = null) {
      clearTimeout(morphSwapTimer);
      clearTimeout(morphRevealTimer);
      notchContent.classList.remove("morphing-hidden");

      if (transitionContext === "music-to-lyrics" || transitionContext === "lyrics-to-music") {
        persistentTopBar.classList.remove("morphing-hidden");
        persistentPaginationBar.classList.remove("morphing-hidden");
        applyNotchDOM(transitionContext);
        return;
      }

      if (!animateMorph) { applyNotchDOM(); return; }

      const exitX = slideDirection > 0 ? "-14px" : slideDirection < 0 ? "14px" : "0px";
      const enterX = slideDirection > 0 ? "14px" : slideDirection < 0 ? "-14px" : "0px";
      const slideY = slideDirection !== 0 ? "0px" : "-4px";

      notchContent.style.setProperty("--slide-x", exitX);
      notchContent.style.setProperty("--slide-y", slideY);
      notchContent.classList.add("morphing-hidden");

      if (!keepPersistentHeader) {
        persistentTopBar.classList.add("morphing-hidden");
        persistentPaginationBar.classList.add("morphing-hidden");
      } else {
        updatePaginationDots(state.mode);
      }

      morphSwapTimer = setTimeout(() => {
        notchContent.style.setProperty("--slide-x", enterX);
        applyNotchDOM();
        requestAnimationFrame(() => {
          morphRevealTimer = setTimeout(() => {
            notchContent.classList.remove("morphing-hidden");
            persistentTopBar.classList.remove("morphing-hidden");
            persistentPaginationBar.classList.remove("morphing-hidden");
          }, 45);
        });
      }, 85);
    }

    function switchMode(newMode, isAutoTrigger = false, explicitDirection = null) {
      const prevMode = state.mode;
      const changed = prevMode !== newMode;
      const isCompanionMorph = companionModes.includes(prevMode) && companionModes.includes(newMode);
      const isSameExpandedSize = expandedModes.includes(prevMode) && expandedModes.includes(newMode);

      let transitionContext = null;
      if (prevMode === "Music" && newMode === "Lyrics") transitionContext = "music-to-lyrics";
      else if (prevMode === "Lyrics" && newMode === "Music") transitionContext = "lyrics-to-music";

      let slideDir = explicitDirection;
      if (slideDir === null && isSameExpandedSize && changed) {
        const prevIdx = expandedModes.indexOf(prevMode);
        const nextIdx = expandedModes.indexOf(newMode);
        slideDir = nextIdx > prevIdx ? 1 : -1;
      }

      if (!isAutoTrigger) { state.autoSleeping = false; state.proximityWaving = false; }
      state.mode = newMode;
      document.querySelectorAll(".mode-pill").forEach(btn => btn.classList.toggle("active", btn.dataset.mode === newMode));

      const pageIdx = expandedModes.indexOf(newMode);
      const pagePrefix = pageIdx !== -1 ? `Page ${pageIdx + 1}/${expandedModes.length} · ` : "";
      const captions = {
        "Resting": "Resting AI · Watch autonomous saccades, double-blinks & 3D head-tilt, or move cursor to track",
        "Waving": "Waving (^ ^ 👋) · Friendly greeting triggered! Click notch or wait to cycle",
        "Sleeping": "Sleeping (∪ ∪ zZ) · Peaceful nap mode · Move mouse if auto-sleeping to wake up",
        "Vibing": "Vibing (^ ^ 🎵) · Bouncing to the background music beat",
        "Surprised": "Surprised (O O !) · Wide-eyed alert expression",
        "Lyrics": "Lyrics Split-View (138px height) · Synchronized live lyrics with ocean-blue ambient bottom glow",
        "Charging": "Charging Animation · Green ring sweeps 0% → 70% with pulsing energy glow & breathing lightning bolt"
      };
      updateCaption(captions[newMode] || `${pagePrefix}${newMode} — Use Left/Right Arrow Keys (← / →) to cycle widget pages`);

      renderNotch(changed && !isCompanionMorph, isSameExpandedSize, slideDir || 0, transitionContext);
      resetInactivitySleepTimer();
    }

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowRight") {
        e.preventDefault();
        cycleExpandedPage(1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        cycleExpandedPage(-1);
      } else if (e.key === "Escape") {
        e.preventDefault();
        switchMode("Resting");
      } else if (e.key === " ") {
        if (state.mode === "Music" || state.mode === "Lyrics") {
          e.preventDefault();
          togglePlay();
        } else if (state.mode === "Focus timer") {
          e.preventDefault();
          toggleFocus();
        }
      }
    });

    document.querySelectorAll(".page-dot-btn").forEach(dot => {
      dot.addEventListener("click", (e) => {
        e.stopPropagation();
        switchMode(dot.dataset.page);
      });
    });

    let inactivitySleepTimer = null;
    let trackingReleaseTimer = null;
    let proximityWaveResetTimer = null;
    let lastAutoWaveTime = 0;

    function resetInactivitySleepTimer() {
      clearTimeout(inactivitySleepTimer);
      if (state.mode === "Resting") {
        inactivitySleepTimer = setTimeout(() => {
          if (state.mode === "Resting") {
            state.autoSleeping = true;
            switchMode("Sleeping", true);
            updateCaption("Auto-Sleep (∪ ∪ zZ) · Companion fell asleep after 14s of inactivity — move mouse to wake!");
          }
        }, 14000);
      }
    }

    window.addEventListener("mousemove", (e) => {
      if (state.autoSleeping && state.mode === "Sleeping") {
        state.autoSleeping = false;
        switchMode("Surprised", true);
        updateCaption("Woke up! (O O !) · Startled awake by cursor movement");
        setTimeout(() => { if (state.mode === "Surprised") switchMode("Resting", true); }, 750);
        return;
      }
      resetInactivitySleepTimer();
      const stage = document.getElementById("companionStage");
      if (!stage || !companionModes.includes(state.mode)) return;
      const rect = notchBody.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      const now = Date.now();
      if (state.mode === "Resting" && dist < 130 && now - lastAutoWaveTime > 4200) {
        lastAutoWaveTime = now;
        state.proximityWaving = true;
        switchMode("Waving", true);
        updateCaption("Proximity Auto-Wave (^ ^ 👋) · Companion noticed your cursor nearby!");
        clearTimeout(proximityWaveResetTimer);
        proximityWaveResetTimer = setTimeout(() => {
          if (state.proximityWaving && state.mode === "Waving") {
            state.proximityWaving = false;
            switchMode("Resting", true);
          }
        }, 1850);
        return;
      }
      if (state.mode === "Resting" || state.mode === "Surprised") {
        const normX = Math.max(-1, Math.min(1, dx / 340));
        const normY = Math.max(-0.5, Math.min(1, dy / 260));
        stage.classList.add("is-tracking");
        stage.style.setProperty("--look-x", `${(normX * 6.5).toFixed(2)}px`);
        stage.style.setProperty("--look-y", `${(normY * 3.2).toFixed(2)}px`);
        stage.style.setProperty("--look-tilt", `${(normX * 3.8).toFixed(2)}deg`);
        stage.style.setProperty("--left-persp", (1 - normX * 0.08).toFixed(3));
        stage.style.setProperty("--right-persp", (1 + normX * 0.08).toFixed(3));
        notchBody.style.setProperty("--glow-shift", `${(normX * 8).toFixed(1)}%`);
        clearTimeout(trackingReleaseTimer);
        trackingReleaseTimer = setTimeout(() => {
          const currentStage = document.getElementById("companionStage");
          if (currentStage) {
            currentStage.classList.remove("is-tracking");
            currentStage.style.setProperty("--look-x", "0px");
            currentStage.style.setProperty("--look-y", "0px");
            currentStage.style.setProperty("--look-tilt", "0deg");
            currentStage.style.setProperty("--left-persp", "1");
            currentStage.style.setProperty("--right-persp", "1");
            notchBody.style.setProperty("--glow-shift", "0%");
          }
        }, 1800);
      }
    });

    function togglePlay() { state.isPlaying = !state.isPlaying; renderNotch(); }
    function nextTrack() { state.trackIndex = (state.trackIndex + 1) % tracks.length; state.elapsed = tracks[state.trackIndex].elapsed; state.isPlaying = true; renderNotch(); }
    function prevTrack() { state.trackIndex = (state.trackIndex - 1 + tracks.length) % tracks.length; state.elapsed = 0; state.isPlaying = true; renderNotch(); }
    function seekTrack(e) {
      const bar = document.getElementById("progressTrack");
      if (!bar) return;
      const rect = bar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      state.elapsed = Math.floor(ratio * tracks[state.trackIndex].duration);
      renderNotch();
    }
    function toggleFocus() { state.focusRunning = !state.focusRunning; renderNotch(); }
    function resetFocus() { state.focusSeconds = 25 * 60; renderNotch(); }
    function addWater() { if (state.waterGlasses < 12) state.waterGlasses++; renderNotch(); }
    function toggleTodo(idx) { if (state.todos[idx]) { state.todos[idx].done = !state.todos[idx].done; renderNotch(); } }
    function openTodoAdd() {
      state.todoSubMode = state.todoSubMode === "add" ? "list" : "add";
      state.todoDraftTitle = "";
      state.todoDraftTime = "";
      renderNotch();
      if (state.todoSubMode === "add") {
        setTimeout(() => {
          const inp = document.getElementById("todoDraftInput");
          if (inp) inp.focus();
        }, 20);
      }
    }
    function cancelTodoDraft() {
      state.todoSubMode = "list";
      state.todoDraftTitle = "";
      state.todoDraftTime = "";
      renderNotch();
    }
    function saveTodoDraft() {
      const sampleTasks = ["Sync Figma tokens", "Ship v1.2 build", "Clean up shelf"];
      const title = state.todoDraftTitle.trim() || sampleTasks[state.todos.length % sampleTasks.length];
      state.todos.unshift({ text: title, done: false });
      state.todoSubMode = "list";
      state.todoDraftTitle = "";
      state.todoDraftTime = "";
      renderNotch();
    }
    function cycleTodoRepeat() {
      const options = ["Daily", "Once", "Weekdays"];
      state.todoDraftRepeat = options[(options.indexOf(state.todoDraftRepeat) + 1) % options.length];
      renderNotch();
    }
    function toggleTodoEditMode() {
      state.todoSubMode = state.todoSubMode === "edit" ? "list" : "edit";
      renderNotch();
    }
    function toggleTodoCompactView() {
      state.todoCompact = !state.todoCompact;
      state.todoSubMode = "list";
      renderNotch();
    }
    function moveTodo(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= state.todos.length) return;
      const temp = state.todos[idx];
      state.todos[idx] = state.todos[target];
      state.todos[target] = temp;
      renderNotch();
    }
    function deleteTodo(idx) {
      state.todos.splice(idx, 1);
      if (state.todos.length === 0) state.todoSubMode = "list";
      renderNotch();
    }
    function handleShelfFiles(e) {
      const files = e.target.files;
      if (!files || !files.length) return;
      const titleEl = document.getElementById("shelfTitle");
      const subEl = document.getElementById("shelfSub");
      if (titleEl && subEl) {
        titleEl.textContent = files.length === 1 ? files[0].name : `${files.length} files staged on Shelf`;
        subEl.textContent = "Ready to drag out · click to add more";
      }
    }

    document.querySelectorAll(".mode-pill").forEach(btn => btn.addEventListener("click", () => switchMode(btn.dataset.mode)));

    setInterval(() => {
      if (state.isPlaying && (state.mode === "Music" || state.mode === "Lyrics")) {
        const currentTrack = tracks[state.trackIndex];
        if (state.elapsed < currentTrack.duration) {
          state.elapsed++;
          const elapsedEl = document.getElementById("elapsedLabel");
          const remainingEl = document.getElementById("remainingLabel");
          const fillEl = document.getElementById("progressFill");
          if (elapsedEl && remainingEl && fillEl) {
            elapsedEl.textContent = formatTime(state.elapsed);
            remainingEl.textContent = `-${formatTime(currentTrack.duration - state.elapsed)}`;
            fillEl.style.width = `${(state.elapsed / currentTrack.duration) * 100}%`;
          }
        }
      }
      if (state.focusRunning && state.focusSeconds > 0) {
        state.focusSeconds--;
        if (state.mode === "Focus timer") {
          const clockEl = document.getElementById("focusClock");
          if (clockEl) clockEl.textContent = formatTime(state.focusSeconds);
        }
      }
    }, 1000);

    renderNotch();
    resetInactivitySleepTimer();
  </script>
</body>
</html>
